<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Точные часы — Узбекистан (Asia/Tashkent)</title>
  <style>
    :root{font-family:Inter, Roboto, Arial, sans-serif}
    body{display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0f172a;color:#e6eef8;margin:0}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));padding:28px;border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);text-align:center;width:360px}
    h1{margin:0 0 10px;font-size:18px;font-weight:600}
    .time{font-size:48px;font-weight:700;letter-spacing:1px}
    .date{margin-top:8px;font-size:14px;color:#bcd1ee}
    .status{margin-top:12px;font-size:13px;color:#9fb2dd}
    .small{font-size:12px;color:#9fb2dd;margin-top:10px}
    button{margin-top:12px;padding:8px 12px;border-radius:10px;border:0;background:#1e293b;color:#e6eef8;cursor:pointer}
    a{color:inherit}
  </style>
</head>
<body>
  <div class="card">
    <h1>Точные часы — Узбекистан (Asia/Tashkent)</h1>
    <div id="time" class="time">--:--:--</div>
    <div id="date" class="date">Загрузка даты...</div>
    <div id="status" class="status">Синхронизация с сервером времени...</div>
    <button id="resync">Синхронизировать сейчас</button>
    <div class="small">Если синхронизация недоступна, используется время вашего устройства с таймзоной Asia/Tashkent.</div>
  </div>

  <script>
    // Этот файл — готовый проект. Сохраните как clock-uz.html и откройте в браузере.
    // Идея: при загрузке запрашиваем серверное время для Asia/Tashkent (worldtimeapi.org).
    // Затем считаем текущее время как serverTime + (performance.now() - localPerfAtSync).
    // Это уменьшает влияние системного времени пользователя и даёт точную синхронизацию.

    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const statusEl = document.getElementById('status');
    const resyncBtn = document.getElementById('resync');

    // Настройки
    const TIMEZONE = 'Asia/Tashkent';
    const API_URL = 'https://worldtimeapi.org/api/timezone/' + TIMEZONE; // public API
    let serverUnixMs = null;      // ms since epoch according to server at sync moment
    let perfAtSync = null;       // performance.now() at sync
    let offsetMs = 0;           // optional fixed offset if server returns utc_offset

    async function syncTime() {
      statusEl.textContent = 'Синхронизация с сервером времени...';
      try {
        const resp = await fetch(API_URL, {cache: 'no-store'});
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        // worldtimeapi returns datetime like "2025-12-06T12:34:56.789+05:00" and unixtime (s)
        // prefer unixtime if available
        if (data.unixtime !== undefined) {
          // unixtime is seconds -> convert to ms
          // worldtimeapi.unixtime does not include fractional seconds; but there is 'raw_offset' and 'datetime'
          const nowSec = data.unixtime;
          // Try to extract fractional milliseconds from 'datetime' if present
          let fracMs = 0;
          if (data.datetime) {
            const msMatch = data.datetime.match(/\.(\d{1,3})/);
            if (msMatch) {
              fracMs = parseInt(msMatch[1].padEnd(3,'0'), 10);
            }
          }
          serverUnixMs = nowSec * 1000 + fracMs;
        } else if (data.datetime) {
          serverUnixMs = Date.parse(data.datetime);
        } else {
          // Fallback: use Date now (not ideal)
          serverUnixMs = Date.now();
        }
        // store offset if provided like +05:00
        if (data.utc_offset) {
          const sign = data.utc_offset[0] === '-' ? -1 : 1;
          const parts = data.utc_offset.slice(1).split(':');
          offsetMs = sign * (parseInt(parts[0],10)*3600 + parseInt(parts[1]||'0',10)*60) * 1000;
        }
        perfAtSync = performance.now();
        statusEl.textContent = 'Синхронизировано с сервером времени (' + TIMEZONE + ').';
        return true;
      } catch (err) {
        console.warn('Sync error', err);
        statusEl.textContent = 'Не удалось синхронизироваться с сервером времени. Используется локальное время.';
        // fallback: compute serverUnixMs from local Date but adjusted to timezone using Intl
        const localNow = new Date();
        // Create string for the timezone by formatting the same instant in that timezone
        try {
          const parts = new Intl.DateTimeFormat('en-US', {timeZone: TIMEZONE, hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}).formatToParts(localNow);
          // Build a date string like YYYY-MM-DDTHH:mm:ss
          const obj = {};
          parts.forEach(p=>{ if(p.type!=='literal') obj[p.type]=p.value; });
          const tzDateStr = `${obj.year}-${obj.month}-${obj.day}T${obj.hour}:${obj.minute}:${obj.second}`;
          serverUnixMs = Date.parse(tzDateStr);
          perfAtSync = performance.now();
          return false;
        } catch(e){
          // last resort
          serverUnixMs = Date.now();
          perfAtSync = performance.now();
          return false;
        }
      }
    }

    // Форматируем дату и время для показа
    function formatTime(date) {
      // Часы:мин:сек
      const hh = String(date.getHours()).padStart(2,'0');
      const mm = String(date.getMinutes()).padStart(2,'0');
      const ss = String(date.getSeconds()).padStart(2,'0');
      return `${hh}:${mm}:${ss}`;
    }
    function formatDate(date) {
      // День, DD.MM.YYYY
      const day = String(date.getDate()).padStart(2,'0');
      const month = String(date.getMonth()+1).padStart(2,'0');
      const year = date.getFullYear();
      const weekday = date.toLocaleDateString('ru-RU', {weekday:'long'});
      return `${weekday}, ${day}.${month}.${year}`;
    }

    // Главный цикл: обновляем отображение каждую animation frame для плавности
    function startClock() {
      function tick() {
        const now = new Date(serverUnixMs + (performance.now() - perfAtSync));
        // Приведём/принудительно интерпретировать в времени Asia/Tashkent
        // Поскольку serverUnixMs уже соответствует времени в этой TZ, просто используем now
        timeEl.textContent = formatTime(now);
        dateEl.textContent = formatDate(now);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      // Для долгой работы (несколько часов) можно периодически подстраивать часы
      // пусть каждые 10 минут будет проверка мелкого дрейфа
      setInterval(async ()=>{
        await syncTime(); // пересинхронизируем serverUnixMs и perfAtSync
      }, 10*60*1000);
    }

    // Инициализация
    (async function(){
      await syncTime();
      startClock();
    })();

    resyncBtn.addEventListener('click', async ()=>{
      resyncBtn.disabled = true;
      resyncBtn.textContent = 'Синхронизация...';
      await syncTime();
      resyncBtn.textContent = 'Синхронизировать сейчас';
      resyncBtn.disabled = false;
    });

    // Примечания разработчику:
    // - worldtimeapi.org — публичный и бесплатный, но может быть недоступен. В продакшне лучше иметь собственный сервер
    //   или использовать более надёжные API (например, time API от cloudflare или сервер NTP на бэкенде).
    // - Если вам нужна абсолютная точность (миллисекунды) и защита от неправильных системных часов клиента,
    //   используйте серверную синхронизацию по NTP или выдачу времени с сервера обратной подписью.
  </script>
</body>
</html>
